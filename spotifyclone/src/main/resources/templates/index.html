<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
<link rel="manifest" href="manifest.json">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav>

    <div class="left-nav">

        <i class="fa-brands fa-spotify logo"></i>

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input type="text" id="searchInput" placeholder="Search songs...">

            <button onclick="searchSong()">Search</button>

        </div>

    </div>

    <div class="right-nav">

        <button class="premium-btn">Premium</button>

       <button class="download-btn" onclick="installApp()">
    Download App
</button>

        <div class="profile">
            <i class="fa-solid fa-user"></i>
            <span id="username">User</span>
        </div>

        <button onclick="logout()" class="logout-btn">Logout</button>

    </div>

</nav>

<!-- ================= MAIN ================= -->
<div class="main">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <h3>Your Library</h3>

        <button class="playlist-btn">+ Create Playlist</button>

        <div class="menu">
            <div class="menu-item">❤️ Liked Songs</div>
            <div class="menu-item">🎵 My Playlist</div>
            <div class="menu-item">⬇ Downloaded Songs</div>
            <div class="menu-item">🕓 Recently Played</div>
        </div>

    </div>

    <!-- CONTENT -->
    <div class="content">

        <h2>Trending Songs</h2>

        <div class="cards">

            <div class="card" onclick="playSong('kesariya.mp3')">
                <img src="https://picsum.photos/200?1">
                <h4>Kesariya</h4>
                <p>Arijit Singh</p>
            </div>

            <div class="card" onclick="playSong('omaahi.mp3')">
                <img src="https://picsum.photos/200?2">
                <h4>O Maahi</h4>
                <p>Pritam</p>
            </div>

            <div class="card" onclick="playSong('tumkyamile.mp3')">
                <img src="https://picsum.photos/200?3">
                <h4>Tum Kya Mile</h4>
                <p>Arijit Singh</p>
            </div>

            <div class="card" onclick="playSong('apnabanale.mp3')">
                <img src="https://picsum.photos/200?4">
                <h4>Apna Bana Le</h4>
                <p>Sachin Jigar</p>
            </div>

        </div>

        <h2>Search Results</h2>

        <div id="results" class="cards"></div>

    </div>

</div>

<!-- ================= PLAYER ================= -->
<footer class="player">

    <!-- Song Info -->
    <div class="song-info">
        <span id="currentSong">No Song Selected</span>
    </div>

    <!-- Controls -->
    <div class="controls">

        <button onclick="previousSong()">⏮</button>

        <button id="playPauseBtn" onclick="togglePlayPause()">▶</button>

        <button onclick="nextSong()">⏭</button>

    </div>

    <!-- PROGRESS BAR (TIMELINE) -->
    <div class="progress-container">

        <span id="currentTime">0:00</span>

        <input type="range"
               id="progressBar"
               value="0"
               min="0"
               max="100">

        <span id="duration">0:00</span>

    </div>

    <!-- Volume -->
    <div class="volume">

        🔊

        <input type="range"
               min="0"
               max="1"
               value="1"
               step="0.1"
               id="volumeSlider">

    </div>

</footer>

<!-- AUDIO -->
<audio id="audio-player"></audio>

<!-- JS -->
<script src="js/index.js"></script>

</body>
</html>
