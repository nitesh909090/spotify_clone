<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spotify Login</title>

    <link rel="stylesheet"
          href="/css/login.css">

</head>

<body>

    <div class="container">

        <div class="login-box">

            <h1>Spotify</h1>

            <h2>Log in to Spotify</h2>

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button
                type="button"
                onclick="loginUser()">
                Login
            </button>

            <p>
                Don't have an account?
                <a href="/register">Sign up</a>
            </p>

        </div>

    </div>

    <script src="/js/login.js"></script>

</body>

</html>
